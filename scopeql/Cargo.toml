[package]
name = "scopeql"
version = "0.6.0"

categories = ["database"]
description = "A command-line interface for ScopeDB"
keywords = ["scopedb"]

edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version = "1.97.0"

[dependencies]
anstyle = { version = "1.0.14" }
anyhow = { version = "1.0.100" }
clap = { version = "4.6.5", features = ["cargo", "derive"] }
comfy-table = { version = "7.2.2", default-features = false }
const_format = { version = "0.2.36" }
csv = { version = "1.4.0" }
dialoguer = { version = "0.12.0", default-features = false, features = [
  "password",
] }
dirs = { version = "6.0.0" }
exn = { version = "0.3.0" }
fastrace = { version = "0.7.19", features = ["enable"] }
fastrace-reqwest = { version = "0.3.0" }
hex = { version = "0.4.3" }
indicatif = { version = "0.18.6" }
jiff = { version = "0.2.35", features = ["serde"] }
log = { version = "0.4.33" }
logforth = { version = "0.30.1", features = ["starter-log"] }
memchr = { version = "2.8.3" }
nu-ansi-term = { version = "0.50.3" }
reedline = { version = "0.49.0" }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "default-tls",
  "charset",
  "http2",
  "system-proxy",
  "query",
] }
scopeql-parser = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = [
  "unbounded_depth",
  "preserve_order",
] }
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.4" }
toml_edit = { version = "0.25.13", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }

[build-dependencies]
gix = { version = "0.86.0", default-features = false, features = [
  "sha1",
  "status",
] }
jiff = { version = "0.2.35" }

[lints]
workspace = true

[package.metadata.release]
pre-release-commit-message = "chore: release v{{version}}"
pre-release-hook = ["./scripts/edit-pyproject-version.sh"]
sign-tag = true
tag-name = "v{{version}}"
