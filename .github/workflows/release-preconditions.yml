name: Release Preconditions

on:
  workflow_call:
    inputs:
      # This variable is unused. It is here for being compatible with the release.yml workflow,
      # which is generated by cargo-dist.
      #
      # See also https://axodotdev.github.io/cargo-dist/book/ci/customizing.html#custom-jobs
      plan:
        type: string
        default: ''

jobs:
  precondition:
    if: ${{ github.repository == 'scopedb/scopeql' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ./scopeql/scripts/check-version-tag-match.sh
